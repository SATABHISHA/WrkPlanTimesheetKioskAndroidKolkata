name: wrkplan_timesheet_kiosk
description: "WrkPlan Timesheet Kiosk - Flutter migration from satabhisha branch."
publish_to: 'none'

version: 1.11.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP requests (replaces Volley)
  http: ^1.1.0

  # State management
  provider: ^6.0.0

  # Local storage (replaces Android SharedPreferences)
  shared_preferences: ^2.2.0

  # XML parsing for SOAP responses (replaces org.json.XML.toJSONObject)
  xml: ^6.5.0

  # Image capture for employee face enrollment
  image_picker: ^1.0.0

  # Date/time formatting
  intl: ^0.19.0

  # Location for location-based punch
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
